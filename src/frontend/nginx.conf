server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location ~* ^/api/comparisons/preview-all/?$ {
        client_max_body_size ${COMPARISON_MAX_REQUEST_BYTES};
        error_page 413 = @comparison_body_too_large;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 150s;
        proxy_send_timeout 150s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @comparison_body_too_large {
        default_type application/problem+json;
        return 413 '{"type":"about:blank","status":413,"title":"Request body exceeds the byte limit.","code":"payloadTooLarge","maximumRequestBytes":${COMPARISON_MAX_REQUEST_BYTES}}';
    }

    location ~ ^/api/(household-calculations|household-profile|vehicle-cost-inputs|household-transition|vehicle-draft|comparisons|rule-profile|vehicle-facts)(/|$) {
        client_max_body_size 2m;
        error_page 413 = @household_body_too_large;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @household_body_too_large {
        default_type application/problem+json;
        return 413 '{"type":"about:blank","status":413,"title":"Request body exceeds 2 MiB.","code":"payloadTooLarge"}';
    }

    location ~* ^/api/listing-analyses/?$ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 270s;
        proxy_send_timeout 270s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
