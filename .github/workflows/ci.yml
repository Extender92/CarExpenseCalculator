name: Build, test and verify

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  deployment:
    name: Deployment - update and publication safeguards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Check Bash and deployment regressions
        run: |
          shellcheck -x deployment/*.sh
          node --test tests/deployment/update.test.mjs tests/deployment/publication.test.mjs

  backend:
    name: Backend - build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400
      - name: Restore backend dependencies
        run: dotnet restore CarExpenseCalculator.sln
      - name: Build backend
        run: dotnet build CarExpenseCalculator.sln --configuration Release --no-restore
      - name: Test backend
        run: dotnet test CarExpenseCalculator.sln --configuration Release --no-build

  frontend:
    name: Frontend - lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Test frontend
        run: npm run test
      - name: Build frontend
        run: npm run build

  api-contract:
    name: OpenAPI - verify contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Restore API dependencies
        run: dotnet restore src/backend/CarExpenseCalculator.Api/CarExpenseCalculator.Api.csproj
      - name: Build API for contract generation
        run: dotnet build src/backend/CarExpenseCalculator.Api/CarExpenseCalculator.Api.csproj --no-restore
      - name: Install OpenAPI tooling
        run: npm ci
        working-directory: src/frontend
      - name: Verify generated OpenAPI types
        shell: bash
        run: |
          ASPNETCORE_URLS=http://localhost:5090 dotnet run \
            --project src/backend/CarExpenseCalculator.Api \
            --no-build --no-launch-profile &
          api_pid=$!
          trap 'kill "$api_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:5090/api/openapi/v1.json > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail http://localhost:5090/api/openapi/v1.json > /dev/null
          npm --prefix src/frontend run api:generate
          git diff --exit-code -- src/frontend/src/api/schema.d.ts

  containers:
    name: Docker - build and end-to-end test
    runs-on: ubuntu-latest
    needs: [backend, frontend, api-contract, deployment]
    env:
      COMPOSE_FILE: compose.yaml:compose.e2e.yaml:compose.release-build.yaml
      COMPOSE_PROJECT_NAME: car-expense-e2e
      CEC_BUILD_COMMIT: ${{ github.sha }}
      WEB_PORT: '8091'
      E2E_BASE_URL: http://localhost:8091
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: src/frontend
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: src/frontend
      - name: Verify Compose network and port boundaries
        run: node scripts/verify-compose-boundaries.mjs
      - name: Build production and fake-extractor Docker images
        run: docker compose build
      - name: Verify pinned Codex CLI
        run: docker compose run --rm --no-deps --entrypoint codex codex-extractor --version | grep --fixed-strings "codex-cli 0.153.0"
      - name: Start PostgreSQL
        run: docker compose up --detach postgres
      - name: Apply database migration for end-to-end tests
        run: docker compose run --rm api migrate
      - name: Start API and web
        run: docker compose up --detach api web
      - name: Verify API readiness through Nginx
        run: curl --fail --retry 40 --retry-delay 2 --retry-all-errors http://localhost:8091/api/health/ready
      - name: Run end-to-end tests
        run: npm run e2e -- --project=chromium --workers=1
        working-directory: src/frontend
      - name: Verify URL analysis acceptance boundaries
        run: |
          node --test scripts/log-content-scanner.test.mjs
          node scripts/verify-url-analysis-acceptance.mjs
      - name: Export the exact images exercised by CI
        run: node scripts/export-tested-images.mjs
      - name: Verify source-free deployment in a disposable Docker daemon
        env:
          CEC_TESTED_IMAGES_PATH: ${{ github.workspace }}/temp/prebuilt-deployment/tested-images
          CEC_DEPLOYMENT_RESULTS_PATH: ${{ github.workspace }}/temp/prebuilt-deployment/integration
        run: |
          mkdir -p "$CEC_DEPLOYMENT_RESULTS_PATH"
          docker compose --project-name car-expense-deployment-tests -f tests/deployment/compose.yaml up --detach --wait daemon
          docker compose --project-name car-expense-deployment-tests -f tests/deployment/compose.yaml run --build --rm runner
      - name: Retain verified images for publication without rebuilding
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Extender92/CarExpenseCalculator'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tested-images-${{ github.run_id }}
          path: temp/prebuilt-deployment/tested-images/
          retention-days: 1
          compression-level: 0
          overwrite: true
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop Docker stack
        if: always()
        run: docker compose down --volumes
      - name: Remove the disposable deployment daemon and its test-only data
        if: always()
        env:
          CEC_TESTED_IMAGES_PATH: ${{ github.workspace }}/temp/prebuilt-deployment/tested-images
          CEC_DEPLOYMENT_RESULTS_PATH: ${{ github.workspace }}/temp/prebuilt-deployment/integration
        run: docker compose --project-name car-expense-deployment-tests -f tests/deployment/compose.yaml down --volumes

  publish:
    name: Publish verified deployment
    needs: [backend, frontend, api-contract, deployment, containers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Extender92/CarExpenseCalculator'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
    concurrency:
      group: publish-car-expense-calculator
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8.0.1
        with:
          name: tested-images-${{ github.run_id }}
          path: temp/prebuilt-deployment/tested-images
      - name: Authenticate publication only
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push verified images and publish a complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-deployment.mjs temp/prebuilt-deployment/tested-images
      - name: Remove registry credentials from the runner
        if: always()
        run: docker logout ghcr.io
